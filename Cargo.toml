[package]
name = "mairu"
version = "0.12.0"
authors = ["Sorah Fukumori <her@sorah.jp>"]
description = "on-memory AWS credentials agent and executor"
keywords = ["aws", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://github.com/sorah/mairu"
homepage = "https://github.com/sorah/mairu"
repository = "https://github.com/sorah/mairu"
edition = "2024"
license = "Apache-2.0"

[package.metadata.mairu]
# Hardened peers older than these are not trusted. Raise on releases fixing a client-side or agent-side flaw.
minimum-client-version = "0.12.0"
minimum-agent-version = "0.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.deb]
inherits = "release"
debug = false

[package.metadata.deb]
section = "utils"
default-features = false
features = ["rustls"]
depends = ["libcap2-bin"] # postinst
recommends = "polkitd | policykit-1"
assets = [
  ["target/release/mairu", "usr/bin/", "755"],
  ["pkg/polkit/co.0w0.mairu.policy", "usr/share/polkit-1/actions/", "644"],
]
maintainer-scripts = "pkg/debian/"

# Release debs, with the Windows Hello helper the release workflow puts in target/windows-hello/.
[package.metadata.deb.variants.release]
name = "mairu"
assets = [
  ["target/release/mairu", "usr/bin/", "755"],
  ["pkg/polkit/co.0w0.mairu.policy", "usr/share/polkit-1/actions/", "644"],
  ["target/windows-hello/mairu-windows-hello.exe", "usr/lib/mairu/", "755"],
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
shadow-rs = { version = "2", default-features = false, features = ["build"] }
tonic-prost-build = "0.14.2"

[features]
default = ["cli", "native-tls"]
# The client and agent. Without it only the core library builds.
cli = [
  "dep:async-recursion",
  "dep:aws-config",
  "dep:aws-sdk-sso",
  "dep:aws-sdk-sts",
  "dep:aws-sdk-ssooidc",
  "dep:aws-smithy-http-client",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:axum",
  "dep:cedar-policy",
  "dep:clap",
  "dep:daemonize",
  "dep:headers",
  "dep:hyper",
  "dep:hyper-util",
  "dep:indoc",
  "dep:oauth2",
  "dep:process_path",
  "dep:reqwest",
  "dep:rsa",
  "dep:serde_with",
  "dep:sigstore-trust-root",
  "dep:sigstore-verify",
  "dep:snap",
  "dep:ssh-encoding",
  "dep:ssh-key",
  "dep:tracing-appender",
  "platform-services",
  "tokio/full",
  "tracing-subscriber/json",
  "tracing-subscriber/local-time",
  "tracing-subscriber/time",
]
native-tls = ["cli", "reqwest/default-tls", "sigstore-trust-root?/native-tls"]
rustls = ["cli", "reqwest/rustls-tls-native-roots", "sigstore-trust-root?/rustls"]
# The platform helper's server and backends. Backend dependencies are enabled here.
platform-services = ["dep:zbus", "dep:zbus_polkit", "tokio/process"]
# The standalone helper binary, built without `cli`.
platform-helper = ["platform-services"]
# `mairu-windows-hello.exe`, built for Windows without `cli`.
windows-hello-helper = ["dep:windows"]

[[bin]]
name = "mairu"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mairu-platform-helper"
path = "src/bin/mairu_platform_helper.rs"
required-features = ["platform-helper"]

[[bin]]
name = "mairu-windows-hello"
path = "src/bin/mairu_windows_hello.rs"
required-features = ["windows-hello-helper"]

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
async-recursion = { version = "1.1.1", optional = true }
async-stream = "0.3.6"
async-trait = "0.1.89"
aws-config = { version = "1.8.12", features = ["behavior-version-latest"], optional = true }
aws-sdk-sso = { version = "1.91.0", optional = true }
aws-sdk-sts = { version = "1.95.0", optional = true }
aws-sdk-ssooidc = { version = "1.93.0", optional = true }
aws-smithy-http-client = { version = "1.1.5", default-features = false, features = ["rustls-aws-lc"], optional = true }
aws-smithy-runtime-api = { version = "1.9.3", features = ["client"], optional = true }
aws-smithy-types = { version = "1.3.5", optional = true }
axum = { version = "0.8.7", features = ["tracing", "macros", "query"], optional = true }
cedar-policy = { version = "4.14.0", default-features = false, optional = true }
base64 = "0.22.1"
base64ct = { version = "1.8.1", features = ["alloc", "std"] }
cfg-if = "1.0.4"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["cargo", "derive", "env"], optional = true }
daemonize = { version = "0.1.0", package = "daemonix", optional = true } # https://rustsec.org/advisories/RUSTSEC-2025-0069
futures = "0.3.31"
futures-core = "0.3.31"
headers = { version = "0.4.1", optional = true }
hyper = { version = "1.8.1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.19", optional = true }
indoc = { version = "2.0.7", optional = true }
libc = "0.2.178"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"], optional = true }
once_cell = { version = "1.21.3", features = ["parking_lot"] }
parking_lot = "0.12.5"
pin-project = "1.1.10"
process_path = { version = "0.1.4", optional = true }
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.9.3"
reqwest = { version = "0.12.26", default-features = false, features = ["charset", "http2", "macos-system-configuration", "json"], optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["base64"], optional = true }
sha2 = "0.10.9"
subtle = { version = "2.6.1", features = ["core_hint_black_box"] }
thiserror = "2"
tokio = { version = "1.48.0", features = ["rt", "net", "macros", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.17", features = ["net", "signal"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tower = { version = "0.5.2", features = ["tracing"] }
tracing = { version = "0.1.43", features = ["attributes"] }
tracing-appender = { version = "0.2.4", optional = true }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
url = { version = "2.5.7", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["std", "aarch64", "zeroize_derive", "serde", "derive"] }
shadow-rs = { version = "2", default-features = false }
# ssh-agent presence: SSHSIG verification and the agent protocol.
ssh-encoding = { version = "0.2.0", features = ["std"], optional = true }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "p256", "p384", "p521", "rsa"], optional = true }
# windows-hello presence: RSA PKCS #1 v1.5 verification.
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["resource", "process", "ptrace", "mman", "fs", "signal", "hostname", "user", "socket", "time"] }

# `mairu harden --from` verifies release attestations.
[target.'cfg(target_os = "linux")'.dependencies]
sigstore-trust-root = { version = "0.15.1", default-features = false, features = ["tuf", "aws-lc-rs"], optional = true }
sigstore-verify = { version = "0.15.1", default-features = false, features = ["aws-lc-rs"], optional = true }
snap = { version = "1.1.1", optional = true }
# The platform helper's polkit and Secret Service backends.
zbus = { version = "6.2.0", default-features = false, features = ["proxy", "tokio"], optional = true }
zbus_polkit = { version = "6.0.0", default-features = false, features = ["tokio"], optional = true }

[target.'cfg(any(target_os = "freebsd", target_os = "dragonfly"))'.dependencies]
rustix = { version = "1.1.2", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "Foundation", "Security_Credentials", "Security_Cryptography", "Security_Cryptography_Core", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }

[dev-dependencies]
# Signature fixtures for sk- keys, which no SSH agent library signs without hardware.
ed25519-dalek = "2.2.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
signature = "2.2.0"
# A stub notification daemon in the D-Bus backend's tests.
zbus = { version = "6.2.0", default-features = false, features = ["proxy", "service", "tokio"] }
