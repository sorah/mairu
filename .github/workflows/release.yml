name: release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0' # Big Sur, first macOS release with Apple Silicon support

jobs:
  test:
    uses: ./.github/workflows/_test.yml
    with:
      build: false

  create-release:
    needs: [test]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: extract version
        shell: bash
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION="${VERSION_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            exit 1
          fi
      - name: create release
        run: |
          if gh release view "v${VERSION}" --json id; then
            echo "release already exists"
          else
            gh release create "v${VERSION}" --draft --verify-tag --title "$VERSION"
          fi
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  upload-binaries:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: rustls
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: rustls
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { target: "${{ matrix.target }}", rust-toolchain: 'false' }
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: "${{ matrix.target }}"
      - run: "cargo build --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features || 'default' }}"
      - uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-path: "target/${{ matrix.target }}/release/mairu"
      - name: create archive
        shell: bash
        env:
          TARGET: "${{ matrix.target }}"
          BUNDLE_PATH: "${{ steps.attest.outputs.bundle-path }}"
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/mairu" dist/
          cp "$BUNDLE_PATH" dist/mairu.sigstore.json
          tar -C dist -czf "mairu-${TARGET}.tar.gz" mairu mairu.sigstore.json
      - run: 'gh release upload "${{ github.ref_name }}" "mairu-${{ matrix.target }}.tar.gz"'
        shell: bash
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  upload-debs:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { target: "${{ matrix.target }}" }
      - name: Install cross-compilation tools
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: "${{ matrix.target }}"
      - name: Configure cargo
        shell: bash
        run: |
          mkdir -p .cargo
          echo '[target.${{ matrix.target }}]' >> .cargo/config
          echo 'strip = { path = "${{ matrix.target }}-strip" }' >> .cargo/config
          echo 'objcopy = { path = "${{ matrix.target }}-objcopy" }' >> .cargo/config
      - run: 'cargo install cargo-deb --locked'
      - run: 'cargo deb --target=${{ matrix.target }}'
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "target/${{ matrix.target }}/debian/*.deb"
      - run: 'gh release upload "${{ github.ref_name }}" target/${{ matrix.target }}/debian/*.deb'
        shell: bash
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  publish-crate:
    # Publish to crates.io at very last step, as other upload-* can fail, but reverting a crate publish can be complicated.
    needs: [create-release, upload-binaries, upload-debs]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/mairu
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
