syntax = "proto3";
package mairu;

import "google/protobuf/timestamp.proto";
import "mairu_platform.proto";

message Session {
  uint32 id = 1;
  string server_id = 2;
  string server_url = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool refreshable = 5;
}

message Credentials {
  int64 version = 1;
  string access_key_id = 2;
  string secret_access_key = 3;
  string session_token = 4;
  google.protobuf.Timestamp expiration = 5;
}

service Agent {
  rpc PingAgent(PingAgentRequest) returns (PingAgentResponse);
  rpc GetServer(GetServerRequest) returns (GetServerResponse);
  rpc AssumeRole(AssumeRoleRequest) returns (AssumeRoleResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse)
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);

  rpc InitiateOauthCode(InitiateOAuthCodeRequest) returns (InitiateOAuthCodeResponse);
  rpc CompleteOauthCode(CompleteOAuthCodeRequest) returns (CompleteOAuthCodeResponse);

  rpc InitiateOauthDeviceCode(InitiateOAuthDeviceCodeRequest) returns (InitiateOAuthDeviceCodeResponse);
  rpc CompleteOauthDeviceCode(CompleteOAuthDeviceCodeRequest) returns (CompleteOAuthDeviceCodeResponse);

  rpc RefreshAwsSsoClientRegistration(RefreshAwsSsoClientRegistrationRequest) returns (RefreshAwsSsoClientRegistrationResponse);

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  rpc ShutdownAgent(ShutdownAgentRequest) returns (ShutdownAgentResponse);

  rpc GetAgentStatus(GetAgentStatusRequest) returns (GetAgentStatusResponse);

  rpc RevokeAuthorizations(RevokeAuthorizationsRequest) returns (RevokeAuthorizationsResponse);
  // Always asks the human.
  rpc UnmarkTools(UnmarkToolsRequest) returns (UnmarkToolsResponse);
  // The policy and settings in force; needs a trusted peer and no authorization.
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  // Records the policy files and server configs after asking the human; needs a trusted peer.
  rpc ApprovePolicy(ApprovePolicyRequest) returns (ApprovePolicyResponse);
}

message PingAgentRequest {
}
message PingAgentResponse {
  string version = 1;
  // Lets every client warn about lockdown without an extra RPC.
  PolicyIntegrity policy_integrity = 2;
}

message GetServerRequest {
  string query = 1;
  bool no_cache = 2;
  bool check_session = 3;
}
message GetServerResponse {
  string json = 1;
  bool cached = 2;
  Session session = 3;
}

message AssumeRole {
  string role_arn = 1;
  optional int32 duration_seconds = 2;
  optional string external_id = 3;
  optional string role_session_name = 4;
}

message Rolespec {
  string role = 1;
  AssumeRole assume_role = 2;
}

message AssumeRoleRequest {
  string server_id = 1;
  oneof query {
    string role = 2;
    Rolespec rolespec = 4;
  }
  bool cached = 3;
  ClientContext client_context = 5;
}
message AssumeRoleResponse {
  Credentials credentials = 1;
}

// What the client is about to do with the credentials. Reported by a verified client, so it can
// be shown to the human as fact.
message ClientContext {
  oneof intent {
    ExecIntent exec = 1;
    CredentialProcessIntent credential_process = 2;
  }
  bytes cwd = 3;
  bytes auto_config_path = 4;      // .mairu.json path when role = auto
  repeated string env_names = 5;   // names only, never values; used for tool detection
  // The answer to a challenge of the previous attempt; excluded from the request digest.
  AuthorizationResponse authorization_response = 6;
}

message ExecIntent {
  repeated bytes command = 1;
  string mode = 2;                 // "ecs" | "static"
  bool prefetch = 3;               // the sidecar's auto-refresh, not a request by the command
}

message CredentialProcessIntent {}

message RevokeAuthorizationsRequest {
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_ALL = 1;
    SCOPE_CALLER_SESSION = 2;
  }
  Scope scope = 1;
  bool include_leases = 2;
  repeated string mark_tools = 3;  // mark the caller's terminal session with these labels
}
message RevokeAuthorizationsResponse {
  uint32 revoked_grants = 1;
  uint32 revoked_leases = 2;
}

message UnmarkToolsRequest {
  repeated string tools = 1;
  ClientContext client_context = 2;
}
message UnmarkToolsResponse {
  repeated string remaining = 1;   // labels still marked on the caller's session
}

enum PolicyIntegrity {
  POLICY_INTEGRITY_UNSPECIFIED = 0;
  POLICY_INTEGRITY_ABSENT = 1;
  POLICY_INTEGRITY_APPROVED = 2;
  POLICY_INTEGRITY_UNAPPROVED = 3;
  POLICY_INTEGRITY_TAMPERED = 4;
}

message GetPolicyRequest {
  // When set, effective_policies and effective_settings_json are those in force for this server's roles.
  string server_id = 1;
}
message GetPolicyResponse {
  string effective_policies = 1;       // Cedar text actually in force, built-ins included
  string effective_settings_json = 2;  // authorization.json as in force
  PolicyIntegrity integrity = 3;
  bytes digest = 4;                    // digest of the files as read
  repeated mairu.platform.IntegrityStoreResult stores = 5;
  repeated string notes = 6;           // e.g. "dropped forbid policy.cedar#3: validation error ..."
  repeated ServerIntegrity servers = 7;
  mairu.platform.ApprovalAnchor approval_anchor = 8;  // the anchor in force
}

message ServerIntegrity {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_APPROVED = 1;
    STATE_UNAPPROVED = 2;
    STATE_CHANGED = 3;
  }
  string server_id = 1;
  State state = 2;
  bytes digest = 3;                    // of the config captured in the session, or of the file when not logged in
  bool logged_in = 4;
}

message ApprovePolicyRequest {
  bytes expected_digest = 1;
  ClientContext client_context = 2;
  map<string, bytes> expected_server_digests = 3;   // server id -> server digest
}
message ApprovePolicyResponse {
  PolicyIntegrity integrity = 1;
  repeated mairu.platform.IntegrityStoreResult stores = 2;
}

message ListSessionsRequest {
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RemoveSessionRequest {
  string query = 1;
}
message RemoveSessionResponse {
}
message RefreshSessionRequest {
  string query = 1;
}
message RefreshSessionResponse {
  Session session = 1;
}

message InitiateOAuthCodeRequest {
  string server_id = 1;
  string redirect_url = 2;
}
message InitiateOAuthCodeResponse {
  string handle = 1;
  string authorize_url = 2;
}

message CompleteOAuthCodeRequest {
  string handle = 1;
  string code = 2;
  string state = 3;
}
message CompleteOAuthCodeResponse {
}

message InitiateOAuthDeviceCodeRequest {
  string server_id = 1;
}
message InitiateOAuthDeviceCodeResponse {
  string handle = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  google.protobuf.Timestamp expires_at = 5;
  int32 interval = 6;
}

message CompleteOAuthDeviceCodeRequest {
  string handle = 1;
}
message CompleteOAuthDeviceCodeResponse {
}

message RefreshAwsSsoClientRegistrationRequest {
  string server_id = 1;
  bool force = 2;
}
message RefreshAwsSsoClientRegistrationResponse {
}

message ListRolesRequest {
  string server_id = 1;
}
message ListRolesResponse {
  message Item {
    message Role {
      string name = 1;
      string description = 2;
    }
    string server_id = 1;
    string server_url = 2;
    bool logged_in = 3;
    repeated Role roles = 4;
  }
  repeated Item servers = 1;
}

message ShutdownAgentRequest {
}
message ShutdownAgentResponse {
}

enum HardeningState {
  HARDENING_STATE_UNSPECIFIED = 0;
  HARDENING_STATE_UNHARDENED = 1;
  HARDENING_STATE_HARDENED = 2;
  HARDENING_STATE_MISCONFIGURED = 3;
}

message GetAgentStatusRequest {
  ClientContext client_context = 1;  // env_names, for the caller's tool labels
}
message GetAgentStatusResponse {
  string version = 1;
  HardeningState agent_hardening = 2;
  PeerView caller = 3;
  mairu.platform.Capabilities capabilities = 4;
  uint32 grants = 6;
  uint32 leases = 7;
  string platform_helper = 8;  // e.g. "running pid=4321 verified", "unavailable: helper-unverified"
  repeated string authorization_methods = 9;  // effective order, e.g. ["platform"]
  string profile = 10;  // "default" or "dev"
  PolicyIntegrity policy_integrity = 5;
  repeated mairu.platform.IntegrityStoreResult policy_stores = 11;
  mairu.platform.ApprovalAnchor approval_anchor = 12;  // the anchor in force
}

// A client as the agent sees it.
message PeerView {
  bool verified = 1;
  uint32 pid = 2;
  uint64 start_time = 3;
  string session = 4;  // e.g. "tty sid=4242 /dev/pts/3", "parent pid=777", "none"
  repeated string tools = 5;         // tool labels, e.g. "ai-agent"
  repeated string tool_matches = 6;  // e.g. "process:claude", "env:AI_AGENT", "mark:ai-agent"
  repeated string marks = 7;         // labels marked on the caller's own terminal session
}

// Carried as the binary details of a non-OK tonic::Status (grpc-status-details-bin).
message AuthorizationError {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNVERIFIED_PEER = 1;          // PERMISSION_DENIED
    REASON_DENIED = 2;                   // PERMISSION_DENIED: the human said no or cancelled
    REASON_FORBIDDEN = 3;                // PERMISSION_DENIED: a forbid policy, or disallow_roles
    REASON_NOT_PERMITTED = 4;            // PERMISSION_DENIED: no permit applies, even after a human check
    REASON_UNAVAILABLE = 5;              // FAILED_PRECONDITION: no method could ask the human
    REASON_CHALLENGE = 6;                // FAILED_PRECONDITION: sign `challenge` and retry with the same request
    REASON_NO_AUTHENTICATION_AGENT = 7;  // FAILED_PRECONDITION: polkit has no agent for the requesting process
    REASON_INVALID_RESPONSE = 8;         // PERMISSION_DENIED: a bad, expired or replayed challenge response
    REASON_PRESENCE_REQUIRED = 9;        // FAILED_PRECONDITION: pre-fetch needs a fresh check; nobody was asked
    REASON_CHECK_PENDING = 10;           // FAILED_PRECONDITION: a policy approval waits for its check; the detail names its terminal
  }
  Reason reason = 1;
  string detail = 2;
  AuthorizationChallenge challenge = 3;  // for REASON_CHALLENGE
  repeated string policy_ids = 4;        // @id of the determining forbid policies, for REASON_FORBIDDEN
  repeated string tools = 5;             // tool labels detected
  string gate = 6;                       // "assume-role" (gate 1) or "use-credentials" (gate 2)
  string caller_arn = 7;                 // gate 2: the identity the credentials carry
}

message AuthorizationChallenge {
  bytes challenge_id = 1;          // 16 random bytes
  bytes statement = 2;             // serialized AuthorizationStatement; signed byte-for-byte
  // Acceptable registered keys: OpenSSH "SHA256:..." fingerprints for ssh-agent.
  repeated string key_fingerprints = 3;
  google.protobuf.Timestamp expires_at = 4;
  string method = 5;               // "ssh-agent"
}

// What a challenge's signature approves.
message AuthorizationStatement {
  bytes nonce = 1;                 // 32 random bytes
  bytes agent_instance_id = 2;     // 16 random bytes chosen at agent start
  uint32 peer_pid = 3;
  uint64 peer_start_time = 4;
  string action = 5;               // "assume-role" | "use-credentials" | "approve-policy" | "unmark-tools"
  string server_id = 6;
  Rolespec rolespec = 7;
  bytes request_digest = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message AuthorizationResponse {
  bytes challenge_id = 1;
  oneof result {
    bytes sshsig = 2;              // binary SSHSIG blob
    string declined = 3;           // why the client could not sign: "no-ssh-agent", "no-registered-key", "sign-failed"
  }
}

//----- The following is used for mairu-exec subprocess IPC

message ExecEnvVar {
  string name = 1;
  string value = 2;
}
message ExecEnvironment {
  repeated ExecEnvVar set_vars = 1;
  repeated string remove_vars = 2;
}
// NOTE: ExecEnvironmentAction (helper enum) is implemented directly on proto.rs

message ExecIpcInformExecutorRequest {
  uint32 version = 1;
  message Ready {
    ExecEnvironment environment = 1;
  }
  message Failure {
    string error_message = 1;
  }
  oneof result {
    Ready ready = 2;
    Failure failure = 3;
  }
}
